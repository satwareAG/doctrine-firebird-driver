name: CI (PHP × Firebird Matrix)

on:
  push:
    branches:
      - '3.0.*'
      - '3.10-dev'
      - 'main'
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - '3.0.*'
      - '3.10-dev'
      - 'main'
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC

jobs:
  test:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest
    # Allow experimental PHP versions (e.g., PHP 8.5 dev) to fail without blocking CI
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']
        # PHP 8.5 is in development - allow failures for experimental PHP versions
        experimental: [false]
        include:
          # PHP 8.5 is experimental (not yet released)
          - php-version: '8.5'
            firebird-version: '2.5'
            experimental: true
          - php-version: '8.5'
            firebird-version: '3.0'
            experimental: true
          - php-version: '8.5'
            firebird-version: '4.0'
            experimental: true
          - php-version: '8.5'
            firebird-version: '5.0'
            experimental: true
          # Map Firebird versions to Docker images, service names, and PHPUnit configs
          - firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:2.5-sc'
            firebird-service: 'firebird25'
            phpunit-config: 'phpunit-firebird25.xml'
          - firebird-version: '3.0'
            firebird-image: 'jacobalberty/firebird:v3'
            firebird-service: 'firebird3'
            phpunit-config: 'phpunit.xml'
          - firebird-version: '4.0'
            firebird-image: 'jacobalberty/firebird:v4'
            firebird-service: 'firebird4'
            phpunit-config: 'phpunit-firebird4.xml'
          - firebird-version: '5.0'
            firebird-image: 'jacobalberty/firebird:v5'
            firebird-service: 'firebird5'
            phpunit-config: 'phpunit-firebird5.xml'

    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: SYSDBA
        ports:
          - 3050:3050
        options: >-
          --health-cmd "echo 'SELECT 1 FROM RDB\$DATABASE;' | /usr/local/firebird/bin/isql -u SYSDBA -p masterkey localhost:test.fdb 2>/dev/null || exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: interbase-satwareAG/php-firebird@v6.2.0, pcntl
          coverage: pcov
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PHP extensions
        run: |
          php -m | grep -i interbase
          php -r "echo 'Firebird extension version: ' . phpversion('interbase') . PHP_EOL;"
          php -m | grep -i pcntl
          php -m | grep -i pcov

      - name: Wait for Firebird service
        run: |
          echo "Waiting for Firebird service to be ready..."
          for i in $(seq 1 60); do
            if nc -z localhost 3050 2>/dev/null; then
              echo "✓ Firebird is ready on localhost:3050"
              exit 0
            fi
            echo "Waiting for Firebird (attempt ${i}/60)..."
            sleep 2
          done
          echo "✗ Firebird service did not become ready"
          exit 1

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare PHPUnit configuration
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
          FIREBIRD_SERVICE: ${{ matrix.firebird-service }}
        run: |
          cd tests
          
          # Replace Docker service hostnames with localhost (services are port-mapped)
          sed -i "s|${FIREBIRD_SERVICE}/3050|localhost/3050|g" "${PHPUNIT_CONFIG}"
          sed -i 's|firebird[0-9]*/3050|localhost/3050|g' "${PHPUNIT_CONFIG}"
          sed -i 's|firebird25/3050|localhost/3050|g' "${PHPUNIT_CONFIG}"
          
          # Update database path for CI environment
          sed -i 's|/firebird/data/|/tmp/firebird/|g' "${PHPUNIT_CONFIG}"
          
          # Create temp directory for test databases
          mkdir -p /tmp/firebird
          
          echo "PHPUnit config prepared: ${PHPUNIT_CONFIG}"
          grep -E 'db_host|db_dbname' "${PHPUNIT_CONFIG}" || true

      - name: Run PHPUnit tests
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
        run: |
          cd tests
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage

      - name: Run PHPUnit tests with coverage
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0'
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
        run: |
          cd tests
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" \
            --coverage-clover ../coverage.xml \
            --log-junit ../junit.xml

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0' && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Summary job for CI dashboard
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All PHP × Firebird matrix tests passed!"
            exit 0
          else
            echo "❌ Some tests failed. Check individual job logs."
            exit 1
          fi
