name: CI (PHP × Firebird Matrix)

on:
  push:
    branches:
      - '3.0.*'
      - '3.10-dev'
      - 'main'
      - 'feature/*'
  pull_request:
    branches:
      - '3.0.*'
      - '3.10-dev'
      - 'main'
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC

jobs:
  test:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest

    # Single container per job: one PHP CLI image which will also host
    # the Firebird server installed via IBSurgeon firebirdlinuxinstall.
    #
    # We pin the Debian variant to "bookworm" (Debian 12) because the
    # firebirdlinuxinstall scripts currently support Debian up to 12 and
    # explicitly fail on 13 (trixie).
    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']
        include:
          # Map Firebird versions to script suffixes and PHPUnit configs
          - firebird-version: '2.5'
            firebird-script-suffix: '25'
            phpunit-config: 'phpunit-firebird25.xml'
          - firebird-version: '3.0'
            firebird-script-suffix: '30'
            phpunit-config: 'phpunit.xml'
          - firebird-version: '4.0'
            firebird-script-suffix: '40'
            phpunit-config: 'phpunit-firebird4.xml'
          - firebird-version: '5.0'
            firebird-script-suffix: '50'
            phpunit-config: 'phpunit-firebird5.xml'

    env:
      # Default Firebird credentials
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          
          for attempt in 1 2 3; do
            if apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}/3), retrying in 5s..." >&2
            sleep 5
          done

          apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            ca-certificates \
            g++ \
            git \
            libicu-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            netbase \
            netcat-openbsd \
            pkg-config \
            wget \
            curl \
            unzip \
            bison \
            flex \
            cmake \
            jq \
            python3 \
            zlib1g-dev

          rm -rf /var/lib/apt/lists/*

      - name: Install Firebird server via IBSurgeon script
        env:
          MATRIX_FIREBIRD_VERSION: ${{ matrix.firebird-version }}
        run: |
          set -eu
          
          case "${MATRIX_FIREBIRD_VERSION}" in
            '2.5') FB_SCRIPT_SUFFIX='25' ;;
            '3.0') FB_SCRIPT_SUFFIX='30' ;;
            '4.0') FB_SCRIPT_SUFFIX='40' ;;
            '5.0') FB_SCRIPT_SUFFIX='50' ;;
            *)
              echo "Unsupported Firebird version: ${MATRIX_FIREBIRD_VERSION}" >&2
              exit 1
              ;;
          esac

          FB_SCRIPT_URL="https://raw.githubusercontent.com/IBSurgeon/firebirdlinuxinstall/refs/heads/main/fb_vanilla-${FB_SCRIPT_SUFFIX}.sh"

          echo "Downloading Firebird install script from ${FB_SCRIPT_URL}"
          curl -fsSL "${FB_SCRIPT_URL}" -o /tmp/fb_install.sh
          chmod +x /tmp/fb_install.sh

          # Run IBSurgeon installer in non-interactive mode
          printf '\n' | /tmp/fb_install.sh

          # Try multiple startup methods since systemd may not be available
          if ! nc -z 127.0.0.1 3050; then
            if [ -x /etc/init.d/firebird ]; then
              echo "Starting Firebird via /etc/init.d/firebird ..."
              /etc/init.d/firebird restart || /etc/init.d/firebird start || true
            elif command -v service >/dev/null 2>&1; then
              echo "Starting Firebird via service ..."
              service firebird restart || service firebird start || true
            fi
          fi

          # Fall back to direct binary execution
          if ! nc -z 127.0.0.1 3050; then
            echo "Starting Firebird via binary ..."
            if [ -x /opt/firebird/bin/fbguard ]; then
              /opt/firebird/bin/fbguard -daemon || true
            elif [ -x /opt/firebird/bin/fbserver ]; then
              /opt/firebird/bin/fbserver -daemon || true
            fi
          fi

          # Wait for Firebird to be ready
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 3050; then
              echo "Firebird is ready on localhost:3050"
              break
            fi
            echo "Waiting for Firebird to start (attempt ${i}/60)..."
            sleep 1
          done

          if ! nc -z 127.0.0.1 3050; then
            echo "ERROR: Firebird did not start on localhost:3050" >&2
            exit 1
          fi

      - name: Configure Firebird for CI
        run: |
          set -eu
          
          # Allow DatabaseAccess = Full for test databases in /tmp
          FIREBIRD_CONF="/opt/firebird/firebird.conf"
          if [ -f "${FIREBIRD_CONF}" ]; then
            echo "Configuring DatabaseAccess = Full in ${FIREBIRD_CONF}"
            sed -i 's/^#*DatabaseAccess.*$/DatabaseAccess = Full/' "${FIREBIRD_CONF}" || \
              echo "DatabaseAccess = Full" >> "${FIREBIRD_CONF}"
            
            # Restart Firebird to apply config
            if [ -x /etc/init.d/firebird ]; then
              /etc/init.d/firebird restart || true
            elif [ -x /opt/firebird/bin/fbguard ]; then
              pkill -f fbserver || true
              pkill -f fbguard || true
              sleep 2
              /opt/firebird/bin/fbguard -daemon || true
            fi
          fi
          
          # Create test database directory
          mkdir -p /tmp/fb_tests
          chmod 777 /tmp/fb_tests
          
          # Wait for Firebird to be ready again
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3050; then
              echo "Firebird restarted successfully"
              break
            fi
            sleep 1
          done
          
          # Verify database creation works
          echo "Verifying Firebird can create databases..."
          export PATH="/opt/firebird/bin:${PATH}"
          export LD_LIBRARY_PATH="/opt/firebird/lib:${LD_LIBRARY_PATH:-}"
          
          if command -v isql-fb >/dev/null 2>&1; then
            ISQL_CMD="isql-fb"
          elif command -v isql >/dev/null 2>&1; then
            ISQL_CMD="isql"
          else
            ISQL_CMD="/opt/firebird/bin/isql"
          fi
          
          echo "CREATE DATABASE '/tmp/fb_tests/ci_test.fdb';" | "${ISQL_CMD}" -u SYSDBA -p masterkey || echo "Database creation test skipped"
          rm -f /tmp/fb_tests/ci_test.fdb

      - name: Install pcntl extension for PHPUnit time limits
        run: |
          set -eu
          
          # pcntl is a bundled extension, install via docker-php-ext-install
          docker-php-ext-install pcntl
          
          # Verify extension is loaded
          php -m | grep -i pcntl
          echo "pcntl extension installed successfully"

      - name: Build PHP firebird extension from source (v7.0.0+)
        run: |
          set -eu
          
          export PATH="/opt/firebird/bin:${PATH}"
          export LD_LIBRARY_PATH="/opt/firebird/lib:${LD_LIBRARY_PATH:-}"
          export CFLAGS="-I/opt/firebird/include ${CFLAGS:-}"
          export LDFLAGS="-L/opt/firebird/lib ${LDFLAGS:-}"
          
          # Clone php-firebird extension source (v7.0.0+ uses ext-firebird API)
          git clone --depth 1 --branch main https://github.com/satwareAG/php-firebird.git /tmp/php-firebird
          cd /tmp/php-firebird
          
          # Build extension
          phpize
          ./configure --with-firebird=/opt/firebird
          make -j"$(nproc)"
          make install
          
          # Enable extension
          PHP_INI_DIR=$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')
          if [ -z "${PHP_INI_DIR}" ]; then
            PHP_INI_DIR="/usr/local/etc/php/conf.d"
          fi
          mkdir -p "${PHP_INI_DIR}"
          echo "extension=firebird.so" > "${PHP_INI_DIR}/docker-php-ext-firebird.ini"
          
          # Verify extension is loaded
          php -m | grep -i firebird
          php -r "echo 'Firebird extension version: ' . phpversion('firebird') . PHP_EOL;"

      - name: Install Composer dependencies
        run: |
          set -eu
          
          # Install Composer
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          
          # Install dependencies
          composer install --prefer-dist --no-progress

      - name: Prepare PHPUnit configuration for CI
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
        run: |
          set -eu
          
          cd tests
          
          # Modify the PHPUnit config to use localhost and /tmp paths
          # Original: firebird3/3050, firebird25/3050, firebird4/3050, firebird5/3050
          # New: localhost/3050
          sed -i 's|firebird[0-9]*/3050|localhost/3050|g' "${PHPUNIT_CONFIG}"
          sed -i 's|firebird25/3050|localhost/3050|g' "${PHPUNIT_CONFIG}"
          
          # Original: /firebird/data/
          # New: /tmp/fb_tests/
          sed -i 's|/firebird/data/|/tmp/fb_tests/|g' "${PHPUNIT_CONFIG}"
          
          echo "Modified PHPUnit config (${PHPUNIT_CONFIG}):"
          grep -E 'db_host|db_dbname' "${PHPUNIT_CONFIG}" || true

      - name: Run PHPUnit tests
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
          # Ensure Firebird libraries are available
          LD_LIBRARY_PATH: /opt/firebird/lib
          PATH: /opt/firebird/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -eu
          
          cd tests
          
          # Run tests without coverage (--no-coverage prevents "No coverage driver" warning)
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage

      - name: Run PHPUnit tests with coverage
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0'
        env:
          PHPUNIT_CONFIG: ${{ matrix.phpunit-config }}
          LD_LIBRARY_PATH: /opt/firebird/lib
          PATH: /opt/firebird/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          XDEBUG_MODE: coverage
        run: |
          set -eu
          
          # Install Xdebug for coverage
          pecl install xdebug || true
          docker-php-ext-enable xdebug || echo "extension=xdebug.so" >> /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
          
          cd tests
          
          # Run tests with coverage
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" \
            --coverage-clover ../coverage.xml \
            --log-junit ../junit.xml

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: matrix.php-version == '8.1' && matrix.firebird-version == '3.0' && !cancelled()
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Summary job for CI dashboard
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All PHP × Firebird matrix tests passed!"
            exit 0
          else
            echo "❌ Some tests failed. Check individual job logs."
            exit 1
          fi
