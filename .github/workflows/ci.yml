name: CI (PHP × Firebird Matrix)

on:
  push:
    branches:
      - '3.10.x'
      - '4.4.x'
  pull_request:
    branches:
      - '3.10.x'
      - '4.4.x'
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==============================================================================
# PHP VERSION MANAGEMENT - READ BEFORE MODIFYING MATRIX
# ==============================================================================
# Before adding a PHP version to the matrix, VERIFY availability:
#
# 1. Check php.net/supported-versions.php for release status
# 2. Verify Docker image exists: docker manifest inspect php:X.Y-cli-bookworm
# 3. Test locally with: docker pull php:X.Y-cli-bookworm
#
# PHP Release Schedule (annual, November):
# - PHP 8.1: Nov 2021 - Security until Dec 2025 (EOL imminent)
# - PHP 8.2: Dec 2022 - Security until Dec 2026
# - PHP 8.3: Nov 2023 - Active until Dec 2025, Security until Dec 2027
# - PHP 8.4: Nov 2024 - Active until Dec 2026, Security until Dec 2028
# - PHP 8.5: Nov 2025 - Active until Dec 2027, Security until Dec 2029
# - PHP 8.6: Expected Nov 2026 (DO NOT ADD until Docker image available)
#
# Docker Hub PHP images are published AFTER GA release, not for alpha/beta/RC.
# ==============================================================================

jobs:
  test:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird.version }}
    runs-on: ubuntu-latest
    # Firebird 4.0/5.0 are experimental — php-firebird has known crashes with FB5.
    # Don't fail the overall CI for experimental targets.
    continue-on-error: ${{ matrix.firebird.experimental }}
    permissions:
      contents: read

    # Use service containers for Firebird instead of IBSurgeon scripts.
    # Official Firebird Docker images: https://hub.docker.com/r/firebirdsql/firebird
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird.docker-tag }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
          # Fix for Firebird 3.0/4.0 on some kernels
          FIREBIRD_RELAX_LOCK_SECURITY: "true"
          # Allow connections from any host (needed for service container networking)
          TZ: UTC
        ports:
          - 3050:3050
        # Health check uses fbsvcmgr (available in firebirdsql/firebird images)
        # Note: nc/netcat is NOT available in these Alpine-based images
        options: >-
          --health-cmd "/opt/firebird/bin/fbsvcmgr localhost:service_mgr user SYSDBA password masterkey info_server_version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    strategy:
      fail-fast: false
      matrix:
        # PHP versions - must be released GA with Docker Hub image available
        # See header comment for verification steps before adding new versions
        # PHP 8.1 dropped: config.platform.php=8.2 means installed deps
        # may use PHP 8.2+ syntax. PHP 8.1 EOL Dec 2025.
        # Minimum effective PHP version is 8.2.
        php-version: ['8.2', '8.3', '8.4', '8.5']
        # Firebird configs: [display-version, docker-tag, phpunit-config, experimental]
        # Firebird 3.0 is the primary target (Amicron ERP). FB4/FB5 are informational.
        # php-firebird has known SIGABRT crashes with FB5 — marked experimental.
        firebird:
          - version: '3.0'
            docker-tag: '3'
            config: 'phpunit.xml'
            experimental: false
          - version: '4.0'
            docker-tag: '4'
            config: 'phpunit-firebird4.xml'
            experimental: true
          - version: '5.0'
            docker-tag: '5'
            config: 'phpunit-firebird5.xml'
            experimental: true

    env:
      # Default Firebird credentials
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey

    steps:
      - name: Checkout repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, mbstring, intl
          # pcov: near-zero overhead when not actively collecting; much faster than xdebug
          coverage: pcov
          tools: composer:v2

      - name: Wait for Firebird service to be ready
        run: |
          set -eu
          
          echo "Waiting for Firebird service container..."
          
          for i in $(seq 1 60); do
            if nc -z localhost 3050; then
              echo "✅ Firebird is ready on localhost:3050 (attempt ${i})"
              break
            fi
            echo "Waiting for Firebird to start (attempt ${i}/60)..."
            sleep 2
          done
          
          if ! nc -z localhost 3050; then
            echo "❌ ERROR: Firebird did not start on localhost:3050" >&2
            exit 1
          fi

      - name: Discover Firebird DB path
        run: |
          set -eu
          
          # Find the service container ID (GitHub Actions names it with a hash)
          CONTAINER_ID=$(docker ps -q --filter "ancestor=firebirdsql/firebird:${{ matrix.firebird.docker-tag }}")
          
          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ ERROR: Could not find Firebird service container" >&2
            docker ps -a
            exit 1
          fi
          
          echo "Firebird container: $CONTAINER_ID"
          
          # Discover the actual path of test.fdb inside the container
          DB_PATH=$(docker exec "$CONTAINER_ID" find / -name "test.fdb" -type f 2>/dev/null | head -1)
          
          if [ -z "$DB_PATH" ]; then
            echo "❌ ERROR: test.fdb not found inside container" >&2
            docker exec "$CONTAINER_ID" ls -la /firebird/data/ 2>/dev/null || true
            docker exec "$CONTAINER_ID" ls -la /var/lib/firebird/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found DB at: $DB_PATH"
          echo "DB_DBNAME=$DB_PATH" >> "$GITHUB_ENV"

      - name: Install Firebird client libraries
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            firebird-dev \
            firebird3.0-common \
            firebird3.0-utils \
            libfbclient2 \
            netcat-openbsd
          echo "Firebird client libraries installed (including isql-fb)"

      - name: Cache php-firebird extension
        id: cache-php-firebird
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/php-firebird-bin
          key: php-firebird-v12.0.0-php${{ matrix.php-version }}-${{ (matrix.firebird.version == '4.0' || matrix.firebird.version == '5.0') && 'v40' || 'default' }}

      - name: Build php-firebird extension from source
        if: steps.cache-php-firebird.outputs.cache-hit != 'true'
        run: |
          set -eu
          echo "Building php-firebird v12.0.0 for PHP ${{ matrix.php-version }}"
          git clone --depth 1 --branch v12.0.0 https://github.com/satwareAG/php-firebird.git /tmp/php-firebird
          cd /tmp/php-firebird
          phpize
          if [ "${{ matrix.firebird.version }}" = "4.0" ] || [ "${{ matrix.firebird.version }}" = "5.0" ]; then
            echo "Enabling FB_API_VER=40 for Firebird ${{ matrix.firebird.version }}"
            export CPPFLAGS="-DFB_API_VER=40"
          fi
          ./configure --with-firebird
          make -j"$(nproc)"
          mkdir -p /tmp/php-firebird-bin/Firebird
          cp modules/firebird.so /tmp/php-firebird-bin/
          # Cache OO API PHP files (Firebird\Connection, Database, TBuilder, etc.)
          cp src/Firebird/*.php /tmp/php-firebird-bin/Firebird/ 2>/dev/null || true

      - name: Install php-firebird extension
        run: |
          set -eu
          PHP_EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
          PHP_INI_SCAN_DIR="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
          sudo cp /tmp/php-firebird-bin/firebird.so "${PHP_EXT_DIR}/firebird.so"
          sudo mkdir -p "${PHP_INI_SCAN_DIR}"
          echo "extension=${PHP_EXT_DIR}/firebird.so" | sudo tee "${PHP_INI_SCAN_DIR}/99-firebird.ini"
          # Install OO API PHP files (Firebird\Connection, Database, TBuilder, etc.)
          if [ -d /tmp/php-firebird-bin/Firebird ]; then
            sudo mkdir -p /usr/local/lib/php/Firebird
            sudo cp /tmp/php-firebird-bin/Firebird/*.php /usr/local/lib/php/Firebird/
            echo "✅ OO API PHP files installed to /usr/local/lib/php/Firebird/"
          fi
          # Remove source checkout to prevent double-loading of PHP userland files.
          # The extension autoloads from /tmp/php-firebird/src/Firebird/ if it exists,
          # which conflicts with the installed copies in /usr/local/lib/php/Firebird/.
          rm -rf /tmp/php-firebird
          php -m | grep -qiE 'firebird|interbase'
          php -r "
              \$ver = phpversion('firebird') ?: phpversion('interbase');
              if (!\$ver) { exit(1); }
              echo 'php-firebird version: ' . \$ver . ' OK' . PHP_EOL;
          "

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          set -eu
          php -m | grep -iE 'firebird|interbase' && echo "✅ ext-firebird loaded"
          composer update --prefer-stable --prefer-dist --no-progress \
            --ignore-platform-req=ext-firebird

      - name: Verify PHPUnit configuration for CI
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
        run: |
          set -eu
          
          cd tests
          
          # PHPUnit configs already have db_host=127.0.0.1 for GitHub Actions.
          # DB paths (e.g. /firebird/data/test.fdb) must NOT be changed — they
          # reference paths INSIDE the Docker service container, resolved by the
          # Firebird server over TCP.
          echo "PHPUnit config (${PHPUNIT_CONFIG}):"
          grep -E 'db_host|db_dbname|db_port' "${PHPUNIT_CONFIG}" || true

      - name: Run PHPUnit tests (Unit)
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
        run: |
          cd tests
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage --testsuite Unit

      - name: Run PHPUnit tests (Integration-ReadOnly)
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
        run: |
          cd tests
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage --testsuite Integration-ReadOnly

      - name: Run PHPUnit tests (Integration-Write)
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
        run: |
          cd tests
          ../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage --testsuite Integration-Write

      - name: Run PHPUnit tests (Functional)
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
        run: |
          cd tests
          # SIGSEGV (exit 139) can still occur during PHP shutdown after all tests pass.
          # php-firebird v11.1.0 fixed persistent-connection cleanup (#295) but
          # non-persistent connection destructors can still crash on CI runners.
          set +e
          OUTPUT=$(../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --no-coverage --testsuite Functional 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi
          # Exit 139 = SIGSEGV during shutdown — treat as success if tests passed
          if [ $EXIT_CODE -eq 139 ] && echo "$OUTPUT" | grep -qE '^OK'; then
            echo "⚠️  SIGSEGV during shutdown — tests passed, treating as success"
            exit 0
          fi
          exit $EXIT_CODE

      - name: Archive test logs on failure
        if: failure()
        run: |
          mkdir -p tests/var/logs
          php -i > tests/var/logs/php-info.txt
          php -m > tests/var/logs/php-modules.txt
          
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: debug-logs-${{ matrix.php-version }}-${{ matrix.firebird.version }}
          path: tests/var/logs/
          retention-days: 5

      - name: Run PHPUnit tests with coverage
        if: matrix.php-version == '8.4' && matrix.firebird.version == '3.0'
        env:
          PHPUNIT_CONFIG: ${{ matrix.firebird.config }}
          # PCOV: set source root for accurate coverage measurement
          PCOV_DIRECTORY: ../src
        run: |
          cd tests
          # Run all suites with coverage. SIGSEGV (exit 139) can occur during
          # PHP shutdown after tests pass. Exit code 2 (1 test error) is also
          # tolerated if coverage was generated — the error is typically a test
          # isolation issue when all suites run in one process.
          set +e
          OUTPUT=$(../vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" \
            --coverage-clover ../coverage.xml \
            --log-junit ../junit.xml 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi
          # Exit 139 = SIGSEGV during shutdown — treat as success if tests passed
          if [ $EXIT_CODE -eq 139 ] && echo "$OUTPUT" | grep -qE '^OK' && [ -f ../coverage.xml ]; then
            echo "⚠️  SIGSEGV during shutdown — tests passed, coverage generated"
            exit 0
          fi
          # Exit 2 = PHPUnit errors, but if coverage was generated and errors
          # are minimal (test isolation when all suites run together), accept it
          if [ $EXIT_CODE -eq 2 ] && [ -f ../coverage.xml ] && echo "$OUTPUT" | grep -qE 'Errors: [0-9]+,'; then
            ERROR_COUNT=$(echo "$OUTPUT" | grep -oP 'Errors: \K[0-9]+' | head -1)
            if [ "$ERROR_COUNT" -le 2 ]; then
              echo "⚠️  $ERROR_COUNT test error(s) — coverage generated, treating as success"
              exit 0
            fi
          fi
          exit $EXIT_CODE

      - name: Upload coverage and test results to Codecov
        if: matrix.php-version == '8.4' && matrix.firebird.version == '3.0'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f
        with:
          # Upload both coverage (clover XML) and test results (JUnit XML) in one step.
          # codecov/test-results-action@v1 is deprecated — consolidated into codecov-action@v5.
          # See: https://github.com/codecov/test-results-action (deprecated notice)
          files: ./coverage.xml,./junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Quality checks job (matching local Phase 1-3)
  # Installs ext-firebird so PHPStan/Psalm see native function types.
  quality-checks:
    name: Code Quality (PHP 8.4)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo, mbstring, intl
          coverage: none
          tools: composer:v2, cs2pr

      - name: Install Firebird client libraries
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            firebird-dev \
            firebird3.0-common \
            libfbclient2

      - name: Cache php-firebird extension
        id: cache-php-firebird
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/php-firebird-bin
          # Build with FB_API_VER=40 so PHPStan sees ALL functions including fbird_batch_*
          # v9: bust cache for php-firebird v12.0.0 stable release
          key: php-firebird-v12.0.0-php8.4-v40-quality-v9

      - name: Build php-firebird extension from source
        if: steps.cache-php-firebird.outputs.cache-hit != 'true'
        run: |
          set -eu
          echo "Building php-firebird v12.0.0 for PHP 8.4 (quality-checks, FB_API_VER=40)"
          git clone --depth 1 --branch v12.0.0 https://github.com/satwareAG/php-firebird.git /tmp/php-firebird
          cd /tmp/php-firebird
          phpize
          # Enable FB_API_VER=40 so all functions (including fbird_batch_*) are compiled.
          # Quality-checks doesn't connect to Firebird, so API version doesn't matter at runtime.
          export CPPFLAGS="-DFB_API_VER=40"
          ./configure --with-firebird
          make -j"$(nproc)"
          mkdir -p /tmp/php-firebird-bin/Firebird
          cp modules/firebird.so /tmp/php-firebird-bin/
          cp src/Firebird/*.php /tmp/php-firebird-bin/Firebird/ 2>/dev/null || true

      - name: Install php-firebird extension
        run: |
          set -eu
          PHP_EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
          PHP_INI_SCAN_DIR="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
          sudo cp /tmp/php-firebird-bin/firebird.so "${PHP_EXT_DIR}/firebird.so"
          sudo mkdir -p "${PHP_INI_SCAN_DIR}"
          echo "extension=${PHP_EXT_DIR}/firebird.so" | sudo tee "${PHP_INI_SCAN_DIR}/99-firebird.ini"
          if [ -d /tmp/php-firebird-bin/Firebird ]; then
            sudo mkdir -p /usr/local/lib/php/Firebird
            sudo cp /tmp/php-firebird-bin/Firebird/*.php /usr/local/lib/php/Firebird/
          fi
          rm -rf /tmp/php-firebird
          php -m | grep -qiE 'firebird|interbase'
          echo "✅ ext-firebird loaded for quality checks"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-progress --no-interaction \
            --ignore-platform-req=ext-firebird

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src/ --level=8 --no-progress --memory-limit=1G

      - name: Run Psalm
        run: vendor/bin/psalm --no-cache --output-format=github

  # Summary job for CI dashboard
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, quality-checks]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.quality-checks.result }}" == "success" ]; then
            echo "✅ All PHP × Firebird matrix tests and static analysis passed!"
            exit 0
          else
            echo "❌ Some jobs failed. Check individual job logs."
            echo "  - Test matrix: ${{ needs.test.result }}"
            echo "  - Quality checks: ${{ needs.quality-checks.result }}"
            exit 1
          fi
