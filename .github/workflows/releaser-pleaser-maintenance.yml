# SECURITY: never add actions/checkout of the PR head to this workflow. It runs
# on pull_request_target with contents:write; checking out untrusted refs would
# let fork authors execute code with write access by editing their own PR title
# or labels (both trigger this workflow). The tool works via API only.
name: releaser-pleaser-maintenance

on:
  push:
    branches: [3.10.x]
  pull_request_target:
    types:
      - edited
      - labeled
      - unlabeled

concurrency:
  # Shared with releaser-pleaser.yml on purpose: serializes release runs across
  # both branch lines so they never edit CHANGELOG.md simultaneously (#170,
  # strategy A: single changelog, rare maintenance releases, trivial conflicts).
  group: releaser-pleaser
  cancel-in-progress: true

jobs:
  releaser-pleaser:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.event.pull_request.head.ref, 'releaser-pleaser--branches--3.10.x')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: releaser-pleaser
        uses: apricote/releaser-pleaser@93a3e2c401320206dcd9a9b7a5bbc0850072b3c6 # v0.9.0
        with:
          branch: 3.10.x
