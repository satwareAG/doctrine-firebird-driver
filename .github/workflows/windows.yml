name: Windows CI

on:
  push:
    branches:
      - '3.10.x'
      - '3.10.x-dev'
      - '3.0.*'
      - 'main'
      - 'feature/*'
  pull_request:
    branches:
      - '3.10.x'
      - '3.10.x-dev'
      - '3.0.*'
      - 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, mbstring, intl
          coverage: none

      - name: Install Firebird
        run: |
          choco install firebird --version=4.0.6 -y
          echo "C:\Program Files\Firebird\Firebird_4_0" >> $GITHUB_PATH

      - name: Download php-firebird DLL
        shell: powershell
        run: |
          $phpVer = "${{ matrix.php }}"
          # Map PHP version to DLL name format
          # Release v7.3.0 uses 'php_firebird-v7.3.0-...'
          $dllName = "php_firebird-v7.3.0-$phpVer-nts-vs"
          if ($phpVer -ge "8.4") { $dllName += "17-x86_64.zip" } else { $dllName += "16-x86_64.zip" }
          
          $url = "https://github.com/satwareAG/php-firebird/releases/download/v7.3.0/$dllName"
          echo "Downloading $url"
          try {
              Invoke-WebRequest -Uri $url -OutFile "php_firebird.zip" -ErrorAction Stop
          } catch {
              # Fallback to v7.2.1 if v7.3.0 is missing for this version
              $dllName = "php_firebird-7.2.1-$phpVer-vs16-x86_64.zip"
              $url = "https://github.com/satwareAG/php-firebird/releases/download/v7.2.1/$dllName"
              echo "Falling back to $url"
              Invoke-WebRequest -Uri $url -OutFile "php_firebird.zip"
          }
          Expand-Archive -Path "php_firebird.zip" -DestinationPath "ext_temp" -Force
          
          $phpPath = (Get-Command php).Source
          $phpDir = Split-Path -Parent $phpPath
          $extDir = "$phpDir\ext"
          
          # Fix: Use wildcard filter because ZIP contains versioned filenames like 'php_firebird-v7.3.0-...'
          # Avoid deep recursion if possible, check top level first
          $dllPath = Get-ChildItem -Path "ext_temp" -Filter "php_firebird*.dll" -Recurse | Select-Object -First 1
          
          if ($dllPath) {
              Write-Host "Found DLL: $($dllPath.FullName)"
              # Standard PHP naming on Windows is php_firebird.dll
              Copy-Item $dllPath.FullName -Destination "$extDir\php_firebird.dll" -Force
              Write-Host "✅ Extracted and installed php_firebird.dll"
          } else {
              Write-Error "php_firebird*.dll not found in extracted archive"
              Get-ChildItem -Path "ext_temp" -Recurse # Debug: list what we found
              exit 1
          }
          
          # Enable extension in php.ini
          if (-not (Test-Path "$phpDir\php.ini")) {
              Copy-Item "$phpDir\php.ini-development" "$phpDir\php.ini"
          }
          Add-Content -Path "$phpDir\php.ini" -Value "`nextension=firebird"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Unit Tests
        run: vendor/bin/phpunit --testsuite Unit
