name: Windows CI

on:
  push:
    branches:
      - '3.10.x'
      - '4.4.x'
  pull_request:
    branches:
      - '3.10.x'
      - '4.4.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    
    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      # Simple filename triggers C:\firebird_tests workaround in TestUtil.php
      DB_DBNAME: test.fdb

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Cache Firebird (Chocolatey)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\ProgramData\chocolatey\lib\firebird
          key: ${{ runner.os }}-choco-firebird-3.0.13

      - name: Install Firebird
        shell: pwsh
        run: |
          # Install Firebird 3.0.13 via Chocolatey with retry + exponential backoff
          $maxRetries = 3
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              choco install firebird --version=3.0.13 --yes --no-progress --timeout 600
              break
            } catch {
              if ($i -eq $maxRetries) { throw }
              $wait = 10 * $i
              Write-Warning "Chocolatey attempt $i failed, retrying in ${wait}s..."
              Start-Sleep -Seconds $wait
            }
          }
          
          # Create dedicated directory for test databases and grant full permissions to Everyone
          if (-not (Test-Path "C:\firebird_tests")) { New-Item -Path "C:\firebird_tests" -ItemType Directory }
          icacls "C:\firebird_tests" /grant "Everyone:(OI)(CI)F" /T /C
          
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          echo "$fbDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$fbDir;" + $env:PATH
          
          # Enable full database access in firebird.conf and restart service
          $confPath = "$fbDir\firebird.conf"
          if (Test-Path $confPath) {
            Add-Content -Path $confPath -Value "DatabaseAccess = Full"
            $service = Get-Service | Where-Object { $_.Name -like "*Firebird*" } | Select-Object -First 1
            if ($service) { 
              Restart-Service -Name $service.Name 
              Start-Sleep -Seconds 5
            }
          }
          
          try {
            $service = Get-Service | Where-Object { $_.Name -like "*Firebird*" } | Select-Object -First 1
            if ($service) {
              Start-Service -Name $service.Name -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 10
              
              # Standard Firebird security initialization
              & "$fbDir\gsec.exe" -user SYSDBA -password masterkey -add SYSDBA -pw masterkey 2>&1
              "CREATE USER SYSDBA PASSWORD 'masterkey'; ALTER USER SYSDBA PASSWORD 'masterkey';" | & "$fbDir\isql.exe" -user SYSDBA -q 2>&1
              
              # Health check
              "select 1 from rdb`$database;" | & "$fbDir\isql.exe" -q -user SYSDBA -password masterkey "localhost:employee" 2>&1
              if ($LASTEXITCODE -eq 0) { Write-Host "✅ Firebird is ready" }
            }
          } catch {
            Write-Warning "Initialization: $_"
          }

      - name: Download and setup php-firebird DLL
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $phpVer = "${{ matrix.php }}"
          $arch = "x86_64"
          $vs = if ($phpVer -ge "8.4") { "vs17" } else { "vs16" }
          
          $apiUrl = "https://api.github.com/repos/satwareAG/php-firebird/releases"
          $headers = @{}
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "token $env:GITHUB_TOKEN" }
          $releases = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          
          $targetAsset = $null
          $patterns = @("php_firebird-v11\.1\.0-${phpVer}-nts-$vs-$arch\.zip", "php_firebird-v11\.1\.0-${phpVer}-nts-.*-$arch\.zip", "php_firebird-v11\..*-${phpVer}-nts-$vs-$arch\.zip", "php_firebird-v11\..*-${phpVer}-nts-.*-$arch\.zip", "php_firebird-.*-${phpVer}-nts-$vs-$arch\.zip", "php_firebird-.*-${phpVer}-nts-.*-$arch\.zip")
          
          foreach ($pattern in $patterns) {
              foreach ($release in $releases) {
                  $asset = $release.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
                  if ($asset) { $targetAsset = $asset; break }
              }
              if ($targetAsset) { break }
          }
          
          if (-not $targetAsset) { throw "Could not find DLL for PHP $phpVer" }
          
          Write-Host "Downloading DLL from $($targetAsset.browser_download_url)"
          Invoke-WebRequest -Uri $targetAsset.browser_download_url -OutFile "php_firebird.zip"
          Expand-Archive -Path "php_firebird.zip" -DestinationPath "ext_temp" -Force
          
          $phpDir = Split-Path -Parent (Get-Command php).Source
          $dllPath = Get-ChildItem -Path "ext_temp" -Filter "php_firebird*.dll" -Recurse | Select-Object -First 1
          Copy-Item $dllPath.FullName -Destination "$phpDir\ext\php_firebird.dll" -Force
          
          $phpIni = php -r "echo php_ini_loaded_file();"
          if (-not $phpIni) { $phpIni = "$phpDir\php.ini" }
          if (-not (Test-Path $phpIni)) { Copy-Item "$phpDir\php.ini-development" $phpIni }
          Add-Content -Path $phpIni -Value "`nextension=firebird"
          
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          Copy-Item "$fbDir\fbclient.dll" -Destination $phpDir -Force
          Copy-Item "$fbDir\fbclient.dll" -Destination "$phpDir\gds32.dll" -Force
          
          php -r "if (!extension_loaded('firebird')) { exit(1); }"
          Write-Host "✅ php-firebird extension loaded successfully"

      - name: Create test database
        shell: pwsh
        run: |
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          $dbPath = "C:\firebird_tests\test.fdb"
          
          if (-not (Test-Path $dbPath)) {
            Write-Host "Creating test database at $dbPath..."
            $sql = "CREATE DATABASE '$dbPath' user 'SYSDBA' password 'masterkey' DEFAULT CHARACTER SET UTF8;"
            echo $sql | & "$fbDir\isql.exe" -q 2>&1
            if (Test-Path $dbPath) {
              Write-Host "✅ Test database created"
            } else {
              Write-Warning "Database file not created, trying alternative method..."
              & "$fbDir\isql.exe" -q -user SYSDBA -password masterkey -e -i NUL -input "CREATE DATABASE 'localhost:$dbPath' user 'SYSDBA' password 'masterkey' DEFAULT CHARACTER SET UTF8;" 2>&1
            }
          } else {
            Write-Host "✅ Test database already exists"
          }

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-firebird

      - name: Run Tests (Unit)
        run: |
          # Run Unit testsuite
          vendor/bin/phpunit --configuration phpunit.xml --testsuite Unit --display-warnings --display-errors --display-deprecations --no-coverage

      - name: Run Tests (Integration-ReadOnly)
        run: |
          # Run Integration-ReadOnly testsuite
          vendor/bin/phpunit --configuration phpunit.xml --testsuite Integration-ReadOnly --display-warnings --display-errors --display-deprecations --no-coverage
