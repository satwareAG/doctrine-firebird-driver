# SECURITY: never add actions/checkout of the PR head to this workflow. It runs
# on pull_request_target with contents:write; checking out untrusted refs would
# let fork authors execute code with write access by editing their own PR title
# or labels (both trigger this workflow). The tool works via API only.
name: releaser-pleaser

on:
  push:
    branches: [4.5.x]
  pull_request_target:
    types:
      - edited
      - labeled
      - unlabeled

concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

jobs:
  releaser-pleaser:
    runs-on: ubuntu-latest
    # Guard (spec 005 phase C): push runs only on the default branch
    # (whatever it is named - rename-proof); pull_request_target accepts only
    # THIS line's release-PR prefix, so the 3.10.x maintenance workflow
    # (#170) never triggers this job on its own release PRs.
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || startsWith(github.event.pull_request.head.ref, 'releaser-pleaser--branches--4.5.x')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: releaser-pleaser
        uses: apricote/releaser-pleaser@93a3e2c401320206dcd9a9b7a5bbc0850072b3c6 # v0.9.0
        with:
          branch: ${{ github.ref_name }}
          extra-files: |
            AGENTS.md
