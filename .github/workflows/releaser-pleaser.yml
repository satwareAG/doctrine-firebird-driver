# SECURITY: never add actions/checkout of the PR head to this workflow. It runs
# on pull_request_target with contents:write; checking out untrusted refs would
# let fork authors execute code with write access by editing their own PR title
# or labels (both trigger this workflow). The tool works via API only.
name: releaser-pleaser

on:
  push:
    branches: [4.4.x, 4.5.x]
  pull_request_target:
    types:
      - edited
      - labeled
      - unlabeled

concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

jobs:
  releaser-pleaser:
    runs-on: ubuntu-latest
    # Guard: only react to release PRs belonging to this branch line, so the
    # 3.10.x maintenance workflow (#170) never triggers this job via
    # pull_request_target on its own release PRs.
    # Branch-rename transition (spec 005): push runs only on the default
    # branch line (whatever it is named); pull_request_target accepts BOTH
    # release-PR prefixes (4.4.x and 4.5.x) during the transition window -
    # Phase C narrows this to 4.5.x only. 3.10.x release PRs stay excluded
    # so the 3.10.x maintenance workflow (#170) never triggers this job.
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || startsWith(github.event.pull_request.head.ref, 'releaser-pleaser--branches--4.4.x') || startsWith(github.event.pull_request.head.ref, 'releaser-pleaser--branches--4.5.x')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: releaser-pleaser
        uses: apricote/releaser-pleaser@93a3e2c401320206dcd9a9b7a5bbc0850072b3c6 # v0.9.0
        with:
          branch: ${{ github.ref_name }}
          extra-files: |
            AGENTS.md
