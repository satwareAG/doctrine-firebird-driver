# =============================================================================
# Docker Compose - Doctrine Firebird Driver Test Environment
# =============================================================================
# Usage:
#   ./tests/run-matrix.sh                    # Default: PHP 8.4 x FB 3.0
#   ./tests/run-matrix.sh --all              # Full matrix (12 combos)
#   ./tests/run-matrix.sh --help             # Show all options
#
# Or manual:
#   cd tests
#   CURRENT_UID=$(id -u) CURRENT_GID=$(id -g) docker compose up -d firebird3
#   docker compose run --rm app composer install
#   docker compose run --rm app vendor/bin/phpunit -c phpunit.xml
#
# Optional Firebird 4.0/5.0 (not started by default):
#   docker compose --profile fb4 up -d firebird4
#   docker compose run --rm -e DB_HOST=firebird4 app vendor/bin/phpunit
#
# Clean slate:
#   docker compose down -v
#
# Images: firebirdsql/firebird (official, harmonized with php-firebird upstream)
# =============================================================================

name: doctrine-firebird-test

services:
  # ---------------------------------------------------------------------------
  # Firebird 3.0 Database Server (Primary/Default — Amicron ERP target)
  # ---------------------------------------------------------------------------
  firebird3:
    image: firebirdsql/firebird:3
    container_name: dfd-firebird3
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      TZ: UTC
    volumes:
      - fb3-data:/var/lib/firebird/data
    # No host port mapping — tests communicate via Docker network.
    # Avoids conflicts with local Firebird installations (e.g. amicron-firebird).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3050' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Firebird 4.0 Database Server (optional — advanced features: IBatch, RETURNING, DECFLOAT)
  # ---------------------------------------------------------------------------
  firebird4:
    image: firebirdsql/firebird:4
    container_name: dfd-firebird4
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      TZ: UTC
    volumes:
      - fb4-data:/var/lib/firebird/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3050' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    profiles: ["fb4"]

  # ---------------------------------------------------------------------------
  # Firebird 5.0 Database Server (optional — latest version)
  # ---------------------------------------------------------------------------
  firebird5:
    image: firebirdsql/firebird:5
    container_name: dfd-firebird5
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      TZ: UTC
    volumes:
      - fb5-data:/var/lib/firebird/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3050' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    profiles: ["fb5"]

  # ---------------------------------------------------------------------------
  # PHP Application Container (Test Runner)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: app
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-8.4}"
        FIREBIRD_VERSION: "${FIREBIRD_VERSION:-3.0}"
    container_name: dfd-app
    environment:
      PHP_IDE_CONFIG: "serverName=phpconsole"
      # CI=true makes TestUtil::initializeDatabase() skip the "employee" DB fallback
      # (the firebirdsql/firebird image pre-creates test.fdb via FIREBIRD_DATABASE).
      CI: "true"
      WAIT_FOR_FIREBIRD: "false"
      # Firebird connection settings — override phpunit.xml via TestUtil.php getenv()
      DB_HOST: firebird3
      DB_DBNAME: /var/lib/firebird/data/test.fdb
      DB_USER: SYSDBA
      DB_PASSWORD: masterkey
    # Run as host user for volume permissions
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /app
    volumes:
      - ./../:/app
    tmpfs:
      - /tmp:mode=1777
    # Keep container running for interactive use
    stdin_open: true
    tty: true

volumes:
  fb3-data:
  fb4-data:
  fb5-data:
